slug: grand-canal-sui
name_en: Sui canal system
era: Sui dynasty, about 604-610 CE
sources:
  wiki-canal:
    url: https://en.wikipedia.org/wiki/Grand_Canal_(China)
    supports: >-
      Tongji links Yangzhou northwest to Luoyang; Yongji links Luoyang northeast; Jiangnan links
      Yangzhou to Suzhou and Hangzhou, through Jiaxing, Wuxi and Changzhou to Zhenjiang; Bian Qu
      leaves the older canal at Chenliu, passes Suzhou (Anhui) and joins the Huai west of Hongze Lake.
  wiki-sui:
    url: https://en.wikipedia.org/wiki/Sui_dynasty
    supports: The system reaches Jiangdu (Yangzhou) and Yuhang (Hangzhou), and the northern frontier near modern Beijing.
  china-highlights:
    url: https://www.chinahighlights.com/travelguide/culture/grand-canal.htm
    supports: Yongji from present Luoyang to Beijing; Tongji from present Luoyang to Huai'an. A travel guide, so used only for endpoints the other sources also imply.
simplifications:
  - The northern branch has only its two endpoints confirmed by these sources, so it is one straight line from Luoyang to the Beijing area. The real canal ran farther east along rivers; do not read its path from this line.
  - Chenliu to Luoyang is straight. No intermediate place was confirmed. The Yellow River was not snapped to, because no source read here says which reach the canal used.
  - All other legs are straight between named cities.
  - Coordinates are those of the modern cities. Sui-era sites can differ by a few kilometers, which does not show at this map scale.
